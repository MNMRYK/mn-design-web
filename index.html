    <!-- COOKIES (Google Consent Mode v2, modo básico, por categorías). Mismo código que
         Landings-mndesignweb/src/components/CookiesHead.astro: si cambias uno, cambia el otro.
         Analítica (GA4 + Clarity) y Marketing (Meta + remarketing de Google Ads), las dos
         desactivadas hasta que el usuario las acepta. El banner (src/Legales/CookieBanner.jsx)
         usa window.leerConsentimiento() y window.guardarConsentimiento(). -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("consent", "default", {
        ad_storage: "denied",
        ad_user_data: "denied",
        ad_personalization: "denied",
        analytics_storage: "denied",
      });

      (function () {
        var CLAVE = "cookieConsent";
        var VERSION = "2";
        var VALORES = {
          accepted: { analitica: true, marketing: true },
          declined: { analitica: false, marketing: false },
          analytics: { analitica: true, marketing: false },
          marketing: { analitica: false, marketing: true },
        };
        // Cookies y almacenamiento de cada categoría (no toca cookieConsent)
        var DATOS = {
          analitica: /^(_ga|_gid|_gat|_cl[a-z]{2}$|clarity)/i,
          marketing: /^(_gcl_|_fb[pc]$)/i,
        };
        var cargado = { google: false, analitica: false, marketing: false };
        window.__trackersCargados = false;

        // Las landings guardaban la decisión en "cookie_consent": se pasa a la clave común
        try {
          var antigua = localStorage.getItem("cookie_consent");
          if (antigua && !localStorage.getItem(CLAVE)) localStorage.setItem(CLAVE, antigua);
          localStorage.removeItem("cookie_consent");
        } catch (e) {}

        // null = todavía no ha decidido (o aceptó con el texto anterior): hay que mostrar el banner
        window.leerConsentimiento = function () {
          try {
            var valor = localStorage.getItem(CLAVE);
            if (!VALORES[valor]) return null;
            if (localStorage.getItem(CLAVE + "Version") !== VERSION && valor !== "declined") return null;
            return { analitica: VALORES[valor].analitica, marketing: VALORES[valor].marketing };
          } catch (e) {
            return null;
          }
        };

        function borrarDatos(categoria) {
          var patron = DATOS[categoria];
          // Dominios donde pueden estar: sin dominio (solo este host), el host y cada dominio padre,
          // con y sin punto delante (www.mndesignweb.es, mndesignweb.es, .mndesignweb.es…)
          var partes = location.hostname.split(".");
          var dominios = [""];
          for (var i = 0; i < partes.length - 1 || i === 0; i++) {
            var d = partes.slice(i).join(".");
            dominios.push("; domain=" + d, "; domain=." + d);
          }
          var rutas = ["; path=/", "; path=" + location.pathname.replace(/[^/]*$/, ""), ""];
          var caduca = "=; expires=Thu, 01 Jan 1970 00:00:00 GMT; max-age=0";
          document.cookie.split(";").forEach(function (c) {
            var nombre = c.split("=")[0].trim();
            if (!nombre || !patron.test(nombre)) return;
            dominios.forEach(function (dominio) {
              rutas.forEach(function (ruta) {
                document.cookie = nombre + caduca + ruta + dominio;
              });
            });
          });
          [window.localStorage, window.sessionStorage].forEach(function (almacen) {
            try {
              Object.keys(almacen).forEach(function (clave) {
                if (clave.indexOf(CLAVE) !== 0 && patron.test(clave)) almacen.removeItem(clave);
              });
            } catch (e) {}
          });
        }

        function cargar(p) {
          if (window.__PRERENDER__ || !(p.analitica || p.marketing)) return;
          window.__trackersCargados = true;

          gtag("consent", "update", {
            analytics_storage: p.analitica ? "granted" : "denied",
            ad_storage: p.marketing ? "granted" : "denied",
            ad_user_data: p.marketing ? "granted" : "denied",
            ad_personalization: p.marketing ? "granted" : "denied",
          });

          // Etiqueta de Google: GA4 y, a través de ella, Google Ads
          if (!cargado.google) {
            cargado.google = true;
            gtag("js", new Date());
            gtag("config", "G-36WYJMYT3Z");
            var ga = document.createElement("script");
            ga.async = true;
            ga.src = "https://www.googletagmanager.com/gtag/js?id=G-36WYJMYT3Z";
            document.head.appendChild(ga);
          }

          // Microsoft Clarity (Analítica)
          if (p.analitica && !cargado.analitica) {
            cargado.analitica = true;
            (function (c, l, a, r, i, t, y) {
              c[a] =
                c[a] ||
                function () {
                  (c[a].q = c[a].q || []).push(arguments);
                };
              t = l.createElement(r);
              t.async = 1;
              t.src = "https://www.clarity.ms/tag/" + i;
              y = l.getElementsByTagName(r)[0];
              y.parentNode.insertBefore(t, y);
            })(window, document, "clarity", "script", "wuzaxaifa0");
          }
          if (cargado.analitica) {
            window.clarity("consentv2", {
              analytics_Storage: "granted",
              ad_Storage: p.marketing ? "granted" : "denied",
            });
          }

          // Píxel de Meta (Marketing)
          if (p.marketing && !cargado.marketing) {
            cargado.marketing = true;
            !(function (f, b, e, v, n, t, s) {
              if (f.fbq) return;
              n = f.fbq = function () {
                n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments);
              };
              if (!f._fbq) f._fbq = n;
              n.push = n;
              n.loaded = !0;
              n.version = "2.0";
              n.queue = [];
              t = b.createElement(e);
              t.async = !0;
              t.src = v;
              s = b.getElementsByTagName(e)[0];
              s.parentNode.insertBefore(t, s);
            })(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
            window.fbq("init", "1627135808585120");
            window.fbq("track", "PageView");
          }
        }

        // Guarda la elección. Si retira algo que ya estaba cargado en esta página, borra sus datos y
        // recarga para pararlo; si solo añade, lo carga sin recargar.
        window.guardarConsentimiento = function (p) {
          var valor = p.analitica && p.marketing ? "accepted" : p.analitica ? "analytics" : p.marketing ? "marketing" : "declined";
          try {
            localStorage.setItem(CLAVE, valor);
            localStorage.setItem(CLAVE + "Version", VERSION);
          } catch (e) {}
          var retira = (cargado.analitica && !p.analitica) || (cargado.marketing && !p.marketing) || (cargado.google && !p.analitica && !p.marketing);
          if (!p.analitica) borrarDatos("analitica");
          if (!p.marketing) borrarDatos("marketing");
          if (retira) location.reload();
          else cargar(p);
        };

        // Al entrar: carga lo aceptado y borra los datos de lo no aceptado (GA4 puede reescribir
        // _ga_<ID> al cerrar la página justo después de un borrado)
        var actual = window.leerConsentimiento() || { analitica: false, marketing: false };
        if (!actual.analitica) borrarDatos("analitica");
        if (!actual.marketing) borrarDatos("marketing");
        cargar(actual);
      })();

      // Eventos de GA4 (conversiones importadas en Google Ads). Solo se envían si la etiqueta de
      // Google está cargada: sin consentimiento no se encola nada que se pudiera enviar después.
      window.enviarEvento = function (nombre, parametros) {
        if (!window.__trackersCargados) return;
        var datos = { pagina: location.pathname };
        for (var k in parametros) datos[k] = parametros[k];
        gtag("event", nombre, datos);
      };

      // Eventos del Píxel de Meta. fbq solo existe si se ha aceptado Marketing.
      window.enviarMeta = function (evento, parametros) {
        if (typeof window.fbq === "function") window.fbq("track", evento, parametros);
      };

      // Clics de contacto en cualquier enlace de la web (único sitio donde se miden; las páginas no
      // deben repetirlo): GA4 click_telefono / click_whatsapp / click_email / click_reserva y, en los
      // tres primeros, Contact en Meta
      document.addEventListener(
        "click",
        function (e) {
          var enlace = e.target.closest && e.target.closest("a[href]");
          if (!enlace) return;
          var href = enlace.getAttribute("href") || "";
          var tipo = /^tel:/i.test(href)
            ? "telefono"
            : /wa\.me\/|api\.whatsapp\.com|^whatsapp:/i.test(href)
              ? "whatsapp"
              : /^mailto:/i.test(href)
                ? "email"
                : /cal\.com\//i.test(href)
                  ? "reserva"
                  : null;
          if (!tipo) return;
          window.enviarEvento("click_" + tipo, { link_url: href });
          if (tipo !== "reserva") window.enviarMeta("Contact", { content_name: { telefono: "phone", whatsapp: "whatsapp", email: "email" }[tipo] });
        },
        true,
      );
    </script>

    <!-- Banner de cookies: su CSS va aquí (no en un .css que llega con React) para que se pinte
         con el HTML, sin esperar a la app. El HTML y el script están al final del <body>. -->
    <style>
      #cookie-banner[hidden] {
        display: none !important;
      }
      #cookie-banner,
      #cookie-banner * {
        box-sizing: border-box;
      }
      .cookie-card-uiverse {
        width: 480px; /* 🔥 Un poco más ancho */
        min-height: 240px; 
        background-color: rgb(255, 255, 255);
        border-radius: 16px; /* 🔥 Bordes un poquito más suaves */
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 30px 40px; /* 🔥 Más espacio interior */
        gap: 18px;
        position: fixed;
        bottom: 30px;
        left: 30px;
        z-index: 999999;
        box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.15); /* 🔥 Sombra más elegante */
        font-family: 'Nunito', sans-serif;
      }

      #cookieSvg {
        width: 60px; /* 🔥 Icono un poco más grande */
      }

      #cookieSvg g path {
        fill: rgb(90, 81, 97);
      }

      .cookieHeading {
        font-size: 1.8em; /* 🔥 Título con más peso */
        font-weight: 800;
        color: rgb(26, 26, 26);
        margin: 0;
        font-family: 'Montserrat', sans-serif;
      }

      .cookieDescription {
        text-align: center;
        font-size: 1.1em; /* 🔥 Texto más legible */
        font-weight: 600;
        font-family: 'Nunito', sans-serif;
        color: rgb(99, 99, 99);
        margin: 0;
        line-height: 1.6;
      }

      .cookielink {
        color: #7E57C2;
        text-decoration: none;
        font-weight: 700;
        display: block;      /* 🔥 Esto hace que el enlace ocupe su propia línea */
        margin-top: 15px;    /* 🔥 Esto separa el enlace del texto de arriba */
      }

      .cookielink:hover {
        text-decoration-line: underline;
      }

      .cookieDescription a {
        color: #7E57C2;
        text-decoration: none;
        font-weight: 700;
      }

      .cookieDescription a:hover {
        text-decoration-line: underline;
      }

      .buttonContainer {
        display: flex;
        gap: 15px;
        flex-direction: row;
        margin-top: 10px;
        width: 100%;
        justify-content: center;
        
      }

      /* Aceptar y Rechazar con el mismo estilo: ninguna opción destaca sobre la otra */
      .botonCookie {
        width: 140px;
        height: 40px;
        background-color: #7E57C2;
        border: none;
        color: white;
        cursor: pointer;
        font-weight: 700;
        border-radius: 20px;
        transition: all .3s ease;
        font-size: 1em;
        font-family: 'Nunito', sans-serif;
      }

      .botonCookie:hover {
        background-color: #6a49a8;
        transform: translateY(-2px);
      }

      .botonCookie:focus-visible {
        outline: 3px solid #1a1a1a;
        outline-offset: 2px;
      }


      /* Responsivo para móviles - CORREGIDO PARA NO CHOCAR CON WHATSAPP */
      @media (max-width: 480px) {
        .cookie-card-uiverse {
          bottom: 10px;        /* Pegadito abajo */
          /* 🔥 REUBICACIÓN CLAVE: Arrinconamos a la izquierda 🔥 */
          left: 10px;          
          right: auto;         
          transform: none;     /* Apagamos el centrado de escritorio */
          
          /* 🔥 ANCHO AJUSTADO: Dejamos espacio a la derecha para WhatsApp 🔥 */
          width: calc(100% - 70px); /* Calculamos el ancho dejando ~70px libres a la derecha */
          max-width: 300px;     /* Ponemos un tope para que no sea muy largo en pantallas grandes */
          
          padding: 20px;       /* Relleno muy compacto */
          min-height: auto;    /* Altura automática */
          gap: 8px;            /* Elementos muy pegaditos */
          border-radius: 12px;
          align-items: flex-start; /* Alineamos los textos a la izquierda */
        }

        /* Mantenemos el resto de optimizaciones de tamaño */
        #cookieSvg {
          display: none; /* Escondemos la galleta en móvil */
        }

        .cookieHeading {
          font-size: 1.1em; /* Título pequeño */
          text-align: left;
        }

        .cookieDescription {
          font-size: 0.8em; /* Texto muy chiquitito */
          line-height: 1.2;
          text-align: left; /* Texto alineado a la izquierda */
        }

        .cookielink {
          margin-top: 8px; /* Un pelín de aire arriba del enlace */
          margin-bottom: 8px; /* Un pelín de aire abajo del enlace */
          font-size: 0.8em;
          display: inline-block; /* Para que los márgenes se apliquen bien */
        }

        .buttonContainer {
          margin-top: 5px; /* Separación con el enlace */
          gap: 8px;
          justify-content: flex-start; 
        }

        .botonCookie {
          width: auto;         /* Ancho automático según texto */
          padding: 0 15px;     /* Relleno lateral */
          height: 30px;        /* Botones bajitos */
          font-size: 0.8em;
        }
      }
      /* ---------- Configuración por categorías (Analítica / Marketing) ---------- */
      /* Enlace a la política + "Configurar" en la misma línea */
      .cc-enlaces {
        display: block;
        margin-top: 15px;
      }
      .cc-enlaces .cookielink {
        display: inline;
        margin: 0 14px 0 0;
      }
      .cc-link {
        background: none;
        border: 0;
        padding: 0;
        font: inherit;
        font-size: 0.85em;
        font-weight: 700;
        color: rgb(99, 99, 99);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
      }
      .cc-link:focus-visible,
      .cc-opcion input:focus-visible {
        outline: 3px solid #1a1a1a;
        outline-offset: 2px;
      }
      .cc-panel {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: left;
      }
      .cc-titulo {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        font-size: 1.3em;
        font-weight: 800;
        color: rgb(26, 26, 26);
      }
      .cc-opcion {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        font-size: 0.95em;
        line-height: 1.45;
        color: rgb(26, 26, 26);
        cursor: pointer;
      }
      .cc-opcion input {
        flex-shrink: 0;
        width: 18px;
        height: 18px;
        margin: 3px 0 0;
        accent-color: #7E57C2;
        cursor: pointer;
      }
      .cc-detalle {
        display: block;
        font-weight: 600;
        color: rgb(99, 99, 99);
      }
      .cc-acciones {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .botonCookie.cc-guardar {
        width: auto;
        padding: 0 20px;
      }

      @media (max-width: 480px) {
        .cc-enlaces {
          margin-top: 8px;
        }
        .cc-enlaces .cookielink {
          font-size: 1em;
        }
        .cc-panel {
          gap: 10px;
          font-size: 0.85em;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <!-- BANNER DE COOKIES. Antes lo pintaba React (src/Legales/CookieBanner.jsx) y aparecía tarde: era
         el LCP de la home. Ahora está en el HTML de todas las páginas y se muestra en el primer pintado.
         Mismo aspecto (CSS en el <head>) y mismo funcionamiento: usa window.leerConsentimiento() y
         window.guardarConsentimiento() del <head>. "Configurar cookies" del pie lanza el evento
         "configurar-cookies" (src/utils/cookies.js), que abre el panel con la elección actual. -->

      <p class="cookieHeading" id="cookie-titulo">¿Aceptas las cookies?</p>
      <p class="cookieDescription">Usamos cookies propias y de terceros para medir las visitas y mostrarte publicidad personalizada. Puedes aceptarlas, rechazarlas o configurarlas.<span class="cc-enlaces"><a class="cookielink" href="/cookies/">Ver la política de cookies</a><button type="button" class="cc-link" id="cc-configurar">Configurar</button></span></p>
      <div class="buttonContainer"><button type="button" class="botonCookie" id="btn-accept-cookies">Aceptar</button><button type="button" class="botonCookie" id="btn-decline-cookies">Rechazar</button></div>
      <div class="cc-panel" role="group" aria-labelledby="cc-titulo" style="display: none">
        <p class="cc-titulo" id="cc-titulo">Configurar cookies</p>
        <label class="cc-opcion">
          <input type="checkbox" id="cc-analitica" />
          <span>
            <strong>Analítica</strong>
            <span class="cc-detalle">Google Analytics y Microsoft Clarity: cuántas visitas recibimos y cómo se usa la web.</span>
          </span>
        </label>
        <label class="cc-opcion">
          <input type="checkbox" id="cc-marketing" />
          <span>
            <strong>Marketing</strong>
            <span class="cc-detalle">Píxel de Meta y remarketing de Google Ads: anuncios personalizados y medición de campañas.</span>
          </span>
        </label>
        <div class="cc-acciones">
          <button type="button" class="cc-link" id="cc-volver">Volver</button>
          <button type="button" class="botonCookie cc-guardar" id="cc-guardar">Guardar preferencias</button>
        </div>
      </div>
    </div>
    <script>
      (function () {
        var banner = document.getElementById("cookie-banner");
        if (!banner || !window.leerConsentimiento || !window.guardarConsentimiento) return;
        var panel = banner.querySelector(".cc-panel");
        var principal = Array.prototype.filter.call(banner.children, function (el) {
          return el !== panel;
        });
        var analitica = document.getElementById("cc-analitica");
        var marketing = document.getElementById("cc-marketing");
        var configurar = document.getElementById("cc-configurar");

        function verVista(vista) {
          var enPanel = vista === "configurar";
          panel.style.display = enPanel ? "" : "none";
          principal.forEach(function (el) {
            el.style.display = enPanel ? "none" : "";
          });
          banner.setAttribute("aria-labelledby", enPanel ? "cc-titulo" : "cookie-titulo");
        }

        function ocultar() {
          banner.hidden = true;
          verVista("principal");
        }

        // Guarda la elección (el <head> carga lo aceptado o, si se retira algo ya cargado, recarga)
        function elegir(preferencias) {
          ocultar();
          window.guardarConsentimiento(preferencias);
        }

        // Casillas desmarcadas si todavía no ha decidido; si no, su elección actual
        function abrirConfiguracion() {
          var actual = window.leerConsentimiento() || { analitica: false, marketing: false };
          analitica.checked = actual.analitica;
          marketing.checked = actual.marketing;
          verVista("configurar");
          banner.hidden = false;
          analitica.focus();
        }

        document.getElementById("btn-accept-cookies").addEventListener("click", function () {
          elegir({ analitica: true, marketing: true });
        });
        document.getElementById("btn-decline-cookies").addEventListener("click", function () {
          elegir({ analitica: false, marketing: false });
        });
        configurar.addEventListener("click", abrirConfiguracion);
        document.getElementById("cc-volver").addEventListener("click", function () {
          verVista("principal");
          configurar.focus();
        });
        document.getElementById("cc-guardar").addEventListener("click", function () {
          elegir({ analitica: analitica.checked, marketing: marketing.checked });
        });
        window.addEventListener("configurar-cookies", abrirConfiguracion);

        // Visible si todavía no hay una decisión válida guardada
        if (!window.leerConsentimiento()) banner.hidden = false;
      })();
    </script>
