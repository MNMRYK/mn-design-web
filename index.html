    <!-- 🔥 META PIXEL 🔥 -->
    <script>
      !(function (f, b, e, v, n, t, s) {
        if (f.fbq) return;
        n = f.fbq = function () {
          n.callMethod
            ? n.callMethod.apply(n, arguments)
            : n.queue.push(arguments);
        };
        if (!f._fbq) f._fbq = n;
        n.push = n;
        n.loaded = !0;
        n.version = "2.0";
        n.queue = [];
        t = b.createElement(e);
        t.async = !0;
        t.src = v;
        s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s);
      })(
        window,
        document,
        "script",
        "https://connect.facebook.net/en_US/fbevents.js",
      );

      // 🛑 CONTROL DE COOKIES PARA META
      var localConsent = localStorage.getItem("cookieConsent");
      if (localConsent !== "accepted") {
        fbq("consent", "revoke"); // Bloqueado por defecto si no hay aceptación
      }

      fbq("init", "1627135808585120");
      fbq("track", "PageView");
    </script>

    <!-- 1. GOOGLE CONSENT MODE: Estado por defecto -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }

      // Miramos si ya hay una decisión guardada
      var localConsent = localStorage.getItem("cookieConsent");

      if (localConsent === "accepted") {
        gtag("consent", "default", {
          ad_storage: "granted",
          ad_user_data: "granted",
          ad_personalization: "granted",
          analytics_storage: "granted",
        });
      } else {
        // Si no ha aceptado o acaba de entrar, lo denegamos todo
        gtag("consent", "default", {
          ad_storage: "denied",
          ad_user_data: "denied",
          ad_personalization: "denied",
          analytics_storage: "denied",
          wait_for_update: 500,
        });
      }
    </script>

    <!-- 🔥 GOOGLE ANALYTICS 🔥 -->

      gtag("js", new Date());
      gtag("config", "G-36WYJMYT3Z");

    </script>
